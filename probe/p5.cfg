# FFF triple junction (Boschman & van Hinsbergen 2016, Fig. 3B-C), geometry 'sym'.
# Generated by make_fff.py; edit the script, not this file.
# box 1200 x 946 x 120 km, junction at (600, 600) km, res = 20 km,
# lithosphere age = 30 Myr, corner buffers = 150 km.
# rotated by 60.0 deg: top A (y1), left B (x0), right C (x1);
# transforms at 30.0 (NE corner), 150.0 (NW corner), 270.0 (south wall) deg.
# plate velocities (cm/yr): A (-2.89, 0.00), B (1.44, -2.50), C (1.44, 2.50)
# pairwise rates (cm/yr): A-B 5.00, A-C 5.00, B-C 5.00

[sim]
modelname = p5
max_time_in_yr = 100000
output_time_interval_in_yr = 25000
#max_steps
is_outputting_averaged_fields = no

[mesh]
meshing_option = 1
xlength = 1200000.000
ylength = 946410.162
zlength = 120000.000
resolution = 20000
quality_check_step_interval = 500
remeshing_option = 13
mmg_hausd_factor = 0.1   # help: 0.1 on top/wall ridges next to restored side walls

[control]
ref_pressure_option = 0
# find_max_vbc() ignores type-6 walls, so the inferred speed would be the 1e-12 m/s floor
# and the inertial scaling would make the plates too heavy to follow their walls.
characteristic_speed = 9.1478e-10

[bc]
surface_temperature = 273
mantle_temperature = 1573
has_water_loading = yes
vbc_z0 = 0
vbc_z1 = 0
vbc_x0 = 6
vbc_val_x0 = 4.573879e-10  # B vx
vbc_val_x0_l = -7.922191e-10  # B vy
vbc_x1 = 6
vbc_val_x1 = 4.573879e-10  # C vx
vbc_val_x1_l = 7.922191e-10  # C vy
vbc_y1 = 6
vbc_val_y1 = 3.046816e-25  # A vy
vbc_val_y1_l = -9.147758e-10  # A vx
vbc_y0 = 0  # open, lithostatic support
vbc_val_y0 = 0

[ic]
temperature_option = 0
oceanic_plate_age_in_yr = 3e+07
weakzone_option = 5
weakzone_plstrain = 0.1
weakzone_num_segments = 5
weakzone_segments_xcenter = [0.5, 0.5, 0.5, 1, 0]
weakzone_segments_ycenter = [0.633975, 0.633975, 0.633975, 1, 1]
weakzone_segments_zcenter = [0.5, 0.5, 0.5, 0.5, 0.5]
weakzone_segments_azimuth = [60, 300, 180, 60, 300]
weakzone_segments_inclination = [90, 90, 90, 90, 90]
weakzone_segments_halfwidth = [1.5, 1.5, 1.5, 3.75, 3.75]
weakzone_segments_x_min = [0.5, 0, 0, 0.875, 0]
weakzone_segments_x_max = [1, 0.5, 1, 1, 0.125]
weakzone_segments_y_min = [0, 0, 0, 0, 0]
weakzone_segments_y_max = [1, 1, 0.633975, 1, 1]
weakzone_segments_depth_min = [0, 0, 0, 0, 0]
weakzone_segments_depth_max = [1, 1, 1, 1, 1]

[mat]
rheology_type = elasto-visco-plastic
num_materials = 2   # 1 = reference only, never placed (see rho_ref in make_fff.py)
mattype_ref = 1
rho0 = [3300, 3208.5]
alpha = [3e-5]
bulk_modulus = [128.2e9]
shear_modulus = [80.5e9]
visc_exponent = [3.05]
visc_coefficient = [1.25e-1]
visc_activation_energy = [3.76e5]
heat_capacity = [1000]
therm_cond = [3.3]
pls0 = [0]
pls1 = [0.1]
cohesion0 = [4e7]
cohesion1 = [4e6]
friction_angle0 = [30]
friction_angle1 = [5]
dilation_angle0 = [0]
dilation_angle1 = [0]
max_viscosity = 1e24
min_viscosity = 1e19

# FFF triple junction (Boschman & van Hinsbergen 2016, Fig. 3B-C), geometry 'bh16'.
# Generated by make_fff.py; edit the script, not this file.
# box 1406 x 1080 x 120 km, junction at (250, 586) km, res = 20 km,
# lithosphere age = 30 Myr, corner buffers = 150 km.
# rotated by 121.7 deg: top FAR (y1), west IZA (x0), southeast PHO (y0, x1);
# transforms at 23.1 (NE corner), 116.9 (NW corner), 246.9 (SW corner) deg.
# probe points (km): FAR (358, 882), IZA (100, 581), PHO (533, 303)
# plate velocities (cm/yr): IZA (-0.60, -3.78), FAR (-2.51, -0.01), PHO (1.79, 1.83)
# pairwise rates (cm/yr): IZA-FAR 4.23, IZA-PHO 6.10, FAR-PHO 4.68

[sim]
modelname = bh20
max_time_in_yr = 3e+06
output_time_interval_in_yr = 100000
checkpoint_frame_interval = 1
#max_steps
is_outputting_averaged_fields = no

[mesh]
meshing_option = 1
xlength = 1406087.560
ylength = 1079509.646
zlength = 120000.000
resolution = 20000
quality_check_step_interval = 500
remeshing_option = 13
mmg_hausd_factor = 0.1   # help: 0.1 on top/wall ridges next to restored side walls

[control]
ref_pressure_option = 0
# find_max_vbc() ignores type-6 walls, so the inferred speed would be the 1e-12 m/s floor
# and the inertial scaling would make the plates too heavy to follow their walls.
characteristic_speed = 1.2122e-09
surface_process_option = 1
surface_diffusivity = 0.001

[bc]
surface_temperature = 273
mantle_temperature = 1573
has_water_loading = yes
vbc_z0 = 0
vbc_z1 = 0
vbc_x0 = 6
vbc_val_x0 = -1.916576e-10  # IZA vx
vbc_val_x0_l = -1.196917e-09  # IZA vy
vbc_x1 = 6
vbc_val_x1 = 5.663551e-10  # PHO vx
vbc_val_x1_l = 5.798353e-10  # PHO vy
vbc_y0 = 6
vbc_val_y0 = 5.798353e-10  # PHO vy
vbc_val_y0_l = 5.663551e-10  # PHO vx
vbc_y1 = 6
vbc_val_y1 = -2.121462e-12  # FAR vy
vbc_val_y1_l = -7.969000e-10  # FAR vx

[ic]
temperature_option = 0
oceanic_plate_age_in_yr = 3e+07
weakzone_option = 5
weakzone_plstrain = 0.1
weakzone_num_segments = 6
weakzone_segments_xcenter = [0.177798, 0.177798, 0.177798, 1, 0, 0]
weakzone_segments_ycenter = [0.54283, 0.54283, 0.54283, 1, 1, 0]
weakzone_segments_zcenter = [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
weakzone_segments_azimuth = [66.883, 333.135, 203.104, 66.883, 333.135, 203.104]
weakzone_segments_inclination = [90, 90, 90, 90, 90, 90]
weakzone_segments_halfwidth = [1.5, 1.5, 1.5, 3.75, 3.75, 3.75]
weakzone_segments_x_min = [0.177798, 0, 0, 0.893321, 0, 0]
weakzone_segments_x_max = [1, 1, 1, 1, 1, 1]
weakzone_segments_y_min = [0, 0.54283, 0, 0, 0.861048, 0]
weakzone_segments_y_max = [1, 1, 0.54283, 1, 1, 0.138952]
weakzone_segments_depth_min = [0, 0, 0, 0, 0, 0]
weakzone_segments_depth_max = [1, 1, 1, 1, 1, 1]

[mat]
rheology_type = elasto-visco-plastic
num_materials = 2   # 1 = reference only, never placed (see rho_ref in make_fff.py)
mattype_ref = 1
rho0 = [3300, 3208.5]
alpha = [3e-05]
bulk_modulus = [128.2e9]
shear_modulus = [80.5e9]
visc_exponent = [3.05]
visc_coefficient = [1.25e-1]
visc_activation_energy = [3.76e5]
heat_capacity = [1000]
therm_cond = [3.3]
pls0 = [0]
pls1 = [0.1]
cohesion0 = [4e7]
cohesion1 = [4e6]
friction_angle0 = [30]
friction_angle1 = [5]
dilation_angle0 = [0]
dilation_angle1 = [0]
max_viscosity = 1e24
min_viscosity = 1e+19

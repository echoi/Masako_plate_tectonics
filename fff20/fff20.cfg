# FFF triple junction (Boschman & van Hinsbergen 2016, Fig. 3B-C), geometry 'sym'.
# Generated by make_fff.py; edit the script, not this file.
# box 1183 x 1183 x 120 km, junction at (250, 933) km, res = 20 km,
# lithosphere age = 30 Myr, corner buffers = 150 km.
# rotated by 45.0 deg: top A (y1), west B (x0), southeast C (y0, x1);
# transforms at 15.0 (NE corner), 135.0 (NW corner), 255.0 (SW corner) deg.
# probe points (km): A (290, 1083), B (100, 893), C (533, 650)
# plate velocities (cm/yr): A (-2.79, 0.75), B (0.75, -2.79), C (2.04, 2.04)
# pairwise rates (cm/yr): A-B 5.00, A-C 5.00, B-C 5.00

[sim]
modelname = fff20
max_time_in_yr = 3e+06
output_time_interval_in_yr = 100000
#max_steps
is_outputting_averaged_fields = no

[mesh]
meshing_option = 1
xlength = 1183012.702
ylength = 1183012.702
zlength = 120000.000
resolution = 20000
quality_check_step_interval = 500
remeshing_option = 13
mmg_hausd_factor = 0.1   # help: 0.1 on top/wall ridges next to restored side walls

[control]
ref_pressure_option = 0
# find_max_vbc() ignores type-6 walls, so the inferred speed would be the 1e-12 m/s floor
# and the inertial scaling would make the plates too heavy to follow their walls.
characteristic_speed = 9.1478e-10
surface_process_option = 1
surface_diffusivity = 0.001

[bc]
surface_temperature = 273
mantle_temperature = 1573
has_water_loading = yes
vbc_z0 = 0
vbc_z1 = 0
vbc_x0 = 6
vbc_val_x0 = 2.367614e-10  # B vx
vbc_val_x0_l = -8.836056e-10  # B vy
vbc_x1 = 6
vbc_val_x1 = 6.468442e-10  # C vx
vbc_val_x1_l = 6.468442e-10  # C vy
vbc_y0 = 6
vbc_val_y0 = 6.468442e-10  # C vy
vbc_val_y0_l = 6.468442e-10  # C vx
vbc_y1 = 6
vbc_val_y1 = 2.367614e-10  # A vy
vbc_val_y1_l = -8.836056e-10  # A vx

[ic]
temperature_option = 0
oceanic_plate_age_in_yr = 3e+07
weakzone_option = 5
weakzone_plstrain = 0.1
weakzone_num_segments = 6
weakzone_segments_xcenter = [0.211325, 0.211325, 0.211325, 1, 0, 0]
weakzone_segments_ycenter = [0.788675, 0.788675, 0.788675, 1, 1, 0]
weakzone_segments_zcenter = [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
weakzone_segments_azimuth = [75, 315, 195, 75, 315, 195]
weakzone_segments_inclination = [90, 90, 90, 90, 90, 90]
weakzone_segments_halfwidth = [1.5, 1.5, 1.5, 3.75, 3.75, 3.75]
weakzone_segments_x_min = [0.211325, 0, 0, 0.873205, 0, 0]
weakzone_segments_x_max = [1, 1, 1, 1, 1, 1]
weakzone_segments_y_min = [0, 0.788675, 0, 0, 0.873205, 0]
weakzone_segments_y_max = [1, 1, 0.788675, 1, 1, 0.126795]
weakzone_segments_depth_min = [0, 0, 0, 0, 0, 0]
weakzone_segments_depth_max = [1, 1, 1, 1, 1, 1]

[mat]
rheology_type = elasto-visco-plastic
num_materials = 2   # 1 = reference only, never placed (see rho_ref in make_fff.py)
mattype_ref = 1
rho0 = [3300, 3208.5]
alpha = [3e-05]
bulk_modulus = [128.2e9]
shear_modulus = [80.5e9]
visc_exponent = [3.05]
visc_coefficient = [1.25e-1]
visc_activation_energy = [3.76e5]
heat_capacity = [1000]
therm_cond = [3.3]
pls0 = [0]
pls1 = [0.1]
cohesion0 = [4e7]
cohesion1 = [4e6]
friction_angle0 = [30]
friction_angle1 = [5]
dilation_angle0 = [0]
dilation_angle1 = [0]
max_viscosity = 1e24
min_viscosity = 1e+19
